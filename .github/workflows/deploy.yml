name: Deploy to GitHub Pages

# Deploys on every push to main. When a Faleth Capital document changes in the MainVault repo, a workflow
# there commits the one-line marker file `.canon-rev` to this repo's main branch; that push is what
# triggers a rebuild (the build fetches the documents fresh). "Run workflow" on the Actions tab rebuilds
# manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping runs queue instead of racing; a run already deploying is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (fetches the Faleth Capital documents first)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
